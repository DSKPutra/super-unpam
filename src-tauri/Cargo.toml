[package]
name = "super-unpam"
version = "0.4.0"
description = "Super UNPAM — Super App Universitas Pamulang (desktop)"
edition = "2021"

[lib]
name = "super_unpam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
# Ukuran installer sekecil mungkin (prinsip "ringan" di Section 8)
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
